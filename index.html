    function puntoEtiquetaDentro(f){

    // Cada manzana obtiene su propia zona de movimiento. Se amplía alrededor de
    // ella y después se le restan las calles: el punto puede ir a cualquier
    // lugar de esa cuadra, pero nunca a la cuadra del otro lado.
    function zonaDe(geo,radio=250,barrerasLocales=barreras){
      try{
        // Una cuadra completa puede medir más de 60 m. Buscamos toda la isla
        // de terreno alrededor del trazo; las calles la dividen en manzanas.
        const alrededor=turf.buffer(geo,radio,{units:'meters'});
        const cercanas=barrerasLocales.features.filter(calle=>turf.booleanIntersects(alrededor,calle));
        const sinCalles=turf.difference(turf.featureCollection([alrededor,...cercanas]));
        return piezaConSemilla(sinCalles,geo);
      }catch(error){console.warn('No se pudo crear el muro local',error);return geo}
    }

      const adentro=turf.destination(borde,.18,turf.bearing(borde,turf.centerOfMass(zona)),{units:'meters'}).geometry.coordinates;
      return turf.booleanPointInPolygon(turf.point(adentro),zona)?adentro:borde.geometry.coordinates;
    }
